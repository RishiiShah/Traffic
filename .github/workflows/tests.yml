name: tests

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        # Only the lightweight deps needed to run the offline unit tests.
        # The heavy ML stack (torch/ultralytics) is not required: tests that
        # depend on it skip automatically via pytest.importorskip.
        run: |
          python -m pip install --upgrade pip
          pip install pytest numpy requests

      - name: Run tests
        run: pytest
